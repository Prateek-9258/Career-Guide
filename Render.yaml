services:
  - type: web
    name: career-guide
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_NAME
        value: career-vision
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true